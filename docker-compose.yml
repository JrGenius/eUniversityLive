services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: euniv
      POSTGRES_PASSWORD: euniv
      POSTGRES_DB: euniv_live
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euniv -d euniv_live"]
      interval: 3s
      timeout: 3s
      retries: 20
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: euniv
      POSTGRES_PASSWORD: euniv
      POSTGRES_DB: euniv_live_test
    ports: ["5443:5432"]
    tmpfs: [/var/lib/postgresql/data]
    profiles: [test]
volumes:
  pgdata:
